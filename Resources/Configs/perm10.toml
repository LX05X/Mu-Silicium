#
# Device Status
# Only the verified 12 GB PERM10-22831 model is described here.
# Add further model variants only after their RAM layout is captured.
#
[status]
model_count = 1

#
# UEFI FD Configs
# PERM10 605 XBL maps the UEFI FD at 0x9FC00000 with size 0x300000
# ("UEFI FD" row in Resources/uefiplatLA.cfg).
#
[uefi_fd]
base = 0x9FC00000
size = 0x300000

#
# Payload Configs
# A raw payload is emitted instead of an Android boot image: no BootShim has
# been validated for PERM10, and an Android boot image would additionally
# require a Resources/DTBs/perm10.dtb that does not exist yet.
#
[payload]
type = "raw"
